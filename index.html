<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InDrive - إنـدرايف مصر</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<body>

    <div class="app-container">
        
        <!-- الهيدر مع زرار تحويل اللغة -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-car-side logo-icon"></i>
                <span id="logo-text">إنـدرايف <strong>مصر</strong></span>
            </div>
            
            <div class="header-actions">
                <!-- زرار تحويل اللغة -->
                <button id="lang-btn" class="lang-btn">EN</button>
                
                <div class="city-badge">
                    <i class="fa-solid fa-location-crosshairs"></i>
                    <span id="current-city-name">الإسكندرية</span>
                </div>
            </div>
        </header>

        <!-- الخريطة -->
        <div class="map-view">
            <div class="map-grid"></div>
            <div class="driver-marker d1"><i class="fa-solid fa-car"></i></div>
            <div class="driver-marker d2"><i class="fa-solid fa-car"></i></div>
            <div class="driver-marker d3"><i class="fa-solid fa-motorcycle"></i></div>
            <div class="pin pickup-pin"><i class="fa-solid fa-location-dot"></i></div>
            <div class="pin dropoff-pin"><i class="fa-solid fa-flag-checkered"></i></div>
        </div>

        <!-- اللوحة السفلية -->
        <div class="bottom-sheet">
            
            <!-- الخطوة 1: طلب الرحلة -->
            <div id="step-request" class="step-content">
                
                <div class="address-card">
                    <div class="input-row">
                        <span class="dot green-dot"></span>
                        <div class="select-wrapper">
                            <label data-i18n="pickupLabel">منين؟</label>
                            <select id="pickup-select"></select>
                        </div>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <div class="input-row">
                        <span class="dot red-dot"></span>
                        <div class="select-wrapper">
                            <label data-i18n="dropoffLabel">على فين؟</label>
                            <select id="dropoff-select"></select>
                        </div>
                    </div>
                </div>

                <!-- اختيار الفئة -->
                <div class="vehicle-selector">
                    <div class="vehicle-card active" data-type="economy">
                        <i class="fa-solid fa-car"></i>
                        <span class="v-name" data-i18n="vEconomy">اقتصادي</span>
                        <span class="v-price" data-i18n="vEconomyPrice">من 35 ج.م</span>
                    </div>
                    <div class="vehicle-card" data-type="comfort">
                        <i class="fa-solid fa-car-side"></i>
                        <span class="v-name" data-i18n="vComfort">كومفورت</span>
                        <span class="v-price" data-i18n="vComfortPrice">من 60 ج.م</span>
                    </div>
                    <div class="vehicle-card" data-type="bike">
                        <i class="fa-solid fa-motorcycle"></i>
                        <span class="v-name" data-i18n="vBike">موتوسيكل</span>
                        <span class="v-price" data-i18n="vBikePrice">من 18 ج.م</span>
                    </div>
                </div>

                <!-- المزايدة -->
                <div class="fare-card">
                    <span class="fare-label" data-i18n="fareLabel">السعر المقترح للرحلة</span>
                    <div class="fare-controls">
                        <button class="btn-circle" id="minus-btn"><i class="fa-solid fa-minus"></i></button>
                        <div class="fare-display">
                            <span id="fare-amount">50</span>
                            <small data-i18n="currency">ج.م</small>
                        </div>
                        <button class="btn-circle" id="plus-btn"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>

                <button id="search-btn" class="main-btn">
                    <span data-i18n="searchBtn">ابحث عن سواقين</span>
                    <i class="fa-solid fa-arrow-left arrow-icon"></i>
                </button>
            </div>

            <!-- الخطوة 2: الرادار -->
            <div id="step-searching" class="step-content hidden text-center">
                <div class="radar-pulse">
                    <i class="fa-solid fa-satellite-dish"></i>
                </div>
                <h3 data-i18n="searchingTitle">جاري البحث عن كابتن قَرِيب...</h3>
                <p data-i18n="searchingSub">بنبعت طلبك للسواقين في نطاق المنطقة</p>
                <button id="cancel-search-btn" class="secondary-btn" data-i18n="cancelBtn">إلغاء البحث</button>
            </div>

            <!-- الخطوة 3: قائمة عروض السواقين -->
            <div id="step-bids" class="step-content hidden">
                <div class="bids-header">
                    <h4><span data-i18n="bidsTitle">عروض الكباتن المتاحة</span> (<span id="bids-count">0</span>)</h4>
                    <span class="user-price-tag"><span data-i18n="yourOffer">عرضك:</span> <strong id="current-user-price">50</strong> <span data-i18n="currency">ج.م</span></span>
                </div>

                <div id="bids-list" class="bids-list"></div>
            </div>

            <!-- الخطوة 4: شاشة التتبع -->
            <div id="step-tracking" class="step-content hidden">
                <div class="status-banner">
                    <i class="fa-solid fa-circle-check"></i>
                    <div>
                        <span class="status-title" data-i18n="offerAccepted">تم قبول العرض!</span>
                        <span class="status-eta"><span data-i18n="etaText">الكابتن يوصل خلال</span> <strong id="eta-timer">03:30</strong> <span data-i18n="mins">دقيقة</span></span>
                    </div>
                </div>

                <div id="accepted-driver-card" class="driver-profile-card"></div>

                <div class="contact-actions">
                    <button class="action-btn call-btn"><i class="fa-solid fa-phone"></i> <span data-i18n="callBtn">اتصال</span></button>
                    <button class="action-btn chat-btn"><i class="fa-solid fa-comment-dots"></i> <span data-i18n="chatBtn">محادثة</span></button>
                </div>

                <button id="cancel-trip-btn" class="danger-btn" data-i18n="cancelTripBtn">إلغاء الرحلة</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
